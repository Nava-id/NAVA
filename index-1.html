<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rating Pelanggan NAVA</title>
<style>
:root{--ac:#2563eb;--bg:#f5f6fb;--cd:#fff;--tx:#111827;--mu:#6b7280;--ln:#e5e7eb;--tr:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--cd:#1a1f45;--tx:#e5e7ff;--mu:#9aa3d8;--ln:#2a2f5e;--tr:#2a2f5e}}
:root[data-theme="dark"]{--bg:#0f1226;--cd:#1a1f45;--tx:#e5e7ff;--mu:#9aa3d8;--ln:#2a2f5e;--tr:#2a2f5e}
html,body{margin:0}*{box-sizing:border-box}
body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:auto;padding-bottom:40px}
.hero{padding:24px 16px;color:#fff;background:var(--ac)}.hero h2{margin:0 0 4px}.hero p{margin:0;opacity:.9}
.pad{padding:14px}h3{margin:0 0 10px;font-size:18px}h4{margin:0 0 8px}.note{font-size:12px;color:var(--mu);margin:0 0 8px}.mu{color:var(--mu)}
.mode{margin:12px 14px 0;padding:10px 12px;border-radius:12px;background:var(--cd);border:1px dashed var(--ac);font-size:12px;color:var(--mu)}
.rsm{display:flex;gap:20px;align-items:center;margin:10px 0 14px}.bg{text-align:center;min-width:92px}.big{font-size:52px;font-weight:500;line-height:1}
.sr{display:inline-flex;gap:1px}.sr em{font-style:normal;font-size:14px;color:#d1d5db}.sr em.f{color:var(--ac)}
.cnt{font-size:12px;color:var(--mu);margin-top:4px}.bars{flex:1}.br{display:flex;gap:8px;align-items:center;font-size:12px;margin:5px 0}.br span{width:10px}
.br i{flex:1;height:10px;border-radius:6px;background:var(--tr);overflow:hidden;display:block}.br u{display:block;height:100%;border-radius:6px;background:var(--ac)}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.chips button{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:999px;padding:6px 12px;white-space:nowrap;font:inherit;cursor:pointer}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rv2{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.av{flex:none;width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700}
.rb{flex:1;min-width:0}.rb>b{display:block}.rm{display:flex;align-items:center;gap:8px;margin:2px 0 4px}.rm small{color:var(--mu);font-size:12px}.rb p{margin:0;word-break:break-word}
.hp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mu)}.hp button{border:1px solid var(--ln);background:none;border-radius:999px;padding:5px 14px;font:inherit;font-size:12px;color:inherit;cursor:pointer}.hp button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rf{margin-top:16px;padding:14px;border-radius:14px;background:var(--cd)}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.stars button{font-size:32px;border:0;background:none;padding:0 4px;color:#d1d5db;cursor:pointer}.stars button.on{color:var(--ac)}
input[type=text]{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:8px}
.hpot{position:absolute;left:-9999px;height:0;overflow:hidden}
.human{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;margin-bottom:10px;cursor:pointer}.human input{width:20px;height:20px;accent-color:var(--ac)}
.go{width:100%;border:0;background:var(--ac);color:#fff;border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer}.go:disabled{opacity:.5}
.adm{margin:0 14px;padding:12px;border-radius:14px;background:var(--cd);border:1px solid var(--ln)}.adm .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}.adm button{border:0;border-radius:8px;padding:6px 10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.rs{margin:14px;border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}
#ts{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9;text-align:center}#ts.s{opacity:1}
</style></head><body>
<div class="hero"><h2>Kopi Senja</h2><p>Pesan mudah, langsung lewat WhatsApp</p></div>
<div class="mode" id="mode"></div>
<div id="rt"></div>
<div id="ad"></div>
<button class="rs" id="rst" hidden>Hapus semua data demo</button>
<div id="ts" role="status"></div>
<script>
// ===== ISI INI UNTUK MODE ASLI (kosongkan = mode demo) =====
var CFG={store:"kopi-senja",url:"",anon:"",turnstile:""};
// ===========================================================
var DEMO=!CFG.url,K="tes_sb_"+CFG.store,R=[],rf=0,rs=0,rn="",rc="",hv={},human=false,tok="",busy=false,lastPost=0;
var $=function(s){return document.querySelector(s)};
function es(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function toast(m){var t=$("#ts");t.textContent=m;t.classList.add("s");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("s")},2800)}
function st(v){var o="";for(var k=1;k<=5;k++)o+='<em class="'+(k<=Math.round(v)?"f":"")+'">★</em>';return '<span class="sr">'+o+'</span>'}
function hd(){return {apikey:CFG.anon,Authorization:"Bearer "+CFG.anon,"Content-Type":"application/json"}}
function ld(){if(DEMO){try{R=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){R=[]}return Promise.resolve()}
return fetch(CFG.url+"/rest/v1/reviews?store=eq."+encodeURIComponent(CFG.store)+"&approved=eq.true&select=id,stars,name,comment,helpful,created_at&order=created_at.desc",{headers:hd()}).then(function(r){return r.json()}).then(function(d){R=Array.isArray(d)?d:[]}).catch(function(){toast("Gagal memuat ulasan")})}
function sv(){if(DEMO)try{localStorage.setItem(K,JSON.stringify(R))}catch(e){}}
function draw(){var A=R.filter(function(x){return x.ok}),n=A.length,c=[0,0,0,0,0,0],a=n?A.reduce(function(s,x){return s+x.stars},0)/n:0;A.forEach(function(x){c[x.stars]++});
var L=A.filter(function(x){return !rf||x.stars==rf});
$("#rt").innerHTML='<div class="pad"><h3>Rating dan ulasan</h3>'
+(n?'<div class="rsm"><div class="bg"><div class="big">'+(Math.round(a*10)/10).toString().replace(".",",")+'</div>'+st(a)+'<div class="cnt">'+n+' ulasan</div></div><div class="bars">'+[5,4,3,2,1].map(function(k){return '<div class="br"><span>'+k+'</span><i><u style="width:'+Math.max(c[k]?4:0,Math.round(c[k]/n*100))+'%"></u></i></div>'}).join("")+'</div></div>':'<p class="mu">Belum ada ulasan. Jadilah yang pertama!</p>')
+(n?'<div class="chips"><button data-rf="0" class="'+(rf?"":"on")+'">Semua</button>'+[5,4,3,2,1].map(function(k){return '<button data-rf="'+k+'" class="'+(rf==k?"on":"")+'">'+k+' ★ · '+c[k]+'</button>'}).join("")+'</div>':'')
+L.map(function(x){var nm=x.name||"Pelanggan";return '<div class="rv2"><div class="av" style="background:hsl('+(nm.charCodeAt(0)*37%360)+',45%,40%)">'+es(nm.charAt(0).toUpperCase())+'</div><div class="rb"><b>'+es(nm)+'</b><div class="rm">'+st(x.stars)+'<small>'+new Date(x.created_at).toLocaleDateString("id-ID")+'</small></div>'+(x.comment?'<p>'+es(x.comment)+'</p>':'')+'<div class="hp">Apakah ulasan ini membantu? <button data-rh="'+x.id+'" class="'+(hv[x.id]?"on":"")+'">Ya'+(x.helpful?' · '+x.helpful:'')+'</button></div></div></div>'}).join("")
+'<div class="rf"><h4>Nilai dan tulis ulasan</h4><div class="stars">'+[1,2,3,4,5].map(function(k){return '<button data-rs="'+k+'" class="'+(k<=rs?"on":"")+'" aria-label="'+k+' bintang">★</button>'}).join("")+'</div><input type="text" id="rn" maxlength="40" placeholder="Nama Anda" value="'+es(rn)+'"><input type="text" id="rc" maxlength="300" placeholder="Ceritakan pengalaman Anda (opsional)" value="'+es(rc)+'"><div class="hpot"><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>'
+(CFG.turnstile?'<div id="tsw"></div>':'<label class="human"><input type="checkbox" data-hu="1" '+(human?"checked":"")+'> Saya bukan robot <span class="note" style="margin:0 0 0 auto">(simulasi)</span></label>')
+'<button class="go" data-rpost="1"'+(busy?" disabled":"")+'>Kirim ulasan</button><p class="note" style="margin-top:8px">Ulasan tampil setelah disetujui pemilik toko.</p></div></div>';
if(CFG.turnstile&&window.turnstile&&$("#tsw"))window.turnstile.render("#tsw",{sitekey:CFG.turnstile,callback:function(t){tok=t}});
drawAdm()}
function drawAdm(){if(!DEMO){$("#ad").innerHTML="";return}var P=R.filter(function(x){return !x.ok});
$("#ad").innerHTML='<div class="adm"><b>Simulasi layar Admin (Supabase)</b><p class="note">Di versi asli, kamu menyetujui lewat Table Editor Supabase dengan mencentang kolom approved.</p>'+(P.length?P.map(function(x){return '<div class="row"><span>'+x.stars+'★ '+es(x.name)+(x.comment?': '+es(x.comment):'')+'</span><button data-ok="'+x.id+'">Setujui</button></div>'}).join(""):'<p class="mu">Tidak ada ulasan yang menunggu.</p>')+'</div>'}
function post(){if(!rs){toast("Pilih bintang dulu");return}
if($("#hp")&&$("#hp").value){toast("Ulasan terkirim");return}
if(Date.now()-lastPost<30000){toast("Tunggu sebentar sebelum kirim lagi");return}
if(CFG.turnstile?!tok:!human){toast("Centang dulu bahwa Anda bukan robot");return}
var nm=(rn||"").trim()||"Pelanggan",cm=(rc||"").trim().slice(0,300);
if(DEMO){R.push({id:Date.now(),stars:rs,name:nm,comment:cm,helpful:0,created_at:Date.now(),ok:false});sv();done();return}
busy=true;draw();
fetch(CFG.url+"/functions/v1/post-review",{method:"POST",headers:hd(),body:JSON.stringify({store:CFG.store,stars:rs,name:nm,comment:cm,token:tok})}).then(function(r){if(!r.ok)throw 0;done()}).catch(function(){busy=false;toast("Gagal mengirim, coba lagi");draw()})}
function done(){busy=false;lastPost=Date.now();rs=0;rc="";human=false;tok="";toast("Terima kasih! Ulasan Anda menunggu persetujuan pemilik toko.");draw()}
document.addEventListener("click",function(e){var b=e.target.closest("button,input[data-hu]");if(!b)return;var d=b.dataset;
if(d.rf!=null)rf=+d.rf;
else if(d.rs)rs=+d.rs;
else if(d.hu){human=b.checked;return}
else if(d.rh!=null){var id=+d.rh;if(hv[id])return;hv[id]=1;
if(DEMO){R.forEach(function(x){if(x.id==id)x.helpful=(x.helpful||0)+1});sv()}else{fetch(CFG.url+"/rest/v1/rpc/helpful",{method:"POST",headers:hd(),body:JSON.stringify({rid:id})});R.forEach(function(x){if(x.id==id)x.helpful=(x.helpful||0)+1})}}
else if(d.ok){R.forEach(function(x){if(x.id==+d.ok)x.ok=true});sv();toast("Ulasan disetujui dan sekarang tampil")}
else if(d.rpost){post();return}
else return;draw()});
document.addEventListener("input",function(e){if(e.target.id=="rn")rn=e.target.value;if(e.target.id=="rc")rc=e.target.value});
$("#rst").onclick=function(){R=[];hv={};sv();draw();toast("Data demo dihapus")};
$("#mode").innerHTML=DEMO?'<b>Mode demo.</b> Ulasan disimpan di browser ini saja, dan layar admin disimulasikan di bawah. Isi <code>CFG</code> di kode untuk memakai Supabase asli.':'<b>Mode Supabase.</b> Ulasan dibaca dan dikirim ke database online.';
if(DEMO)$("#rst").hidden=false;
if(CFG.turnstile){var s=document.createElement("script");s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";s.async=true;s.onload=draw;document.head.appendChild(s)}
ld().then(function(){if(!DEMO)R.forEach(function(x){x.ok=true});else R.forEach(function(x){if(x.ok==null)x.ok=false});draw()});
</script></body></html>
